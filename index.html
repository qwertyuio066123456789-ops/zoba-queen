<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Tahoma,Arial,sans-serif}
body{
  color:#fff; overflow-x:hidden;
  background:#080808;
  position:relative;
}
body:before{
  content:""; position:fixed; inset:-15%;
  z-index:-3;
  background:
    radial-gradient(ellipse at 18% 22%, rgba(220,0,35,.88) 0 12%, transparent 34%),
    radial-gradient(ellipse at 80% 18%, rgba(0,190,70,.78) 0 13%, transparent 36%),
    radial-gradient(ellipse at 48% 88%, rgba(190,0,35,.72) 0 13%, transparent 38%),
    radial-gradient(ellipse at 92% 76%, rgba(0,120,45,.7) 0 12%, transparent 35%),
    #080808;
  filter:blur(18px) saturate(1.25);
  transform:rotate(-4deg) scale(1.1);
}
body:after{
  content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:
    repeating-linear-gradient(117deg,rgba(255,255,255,.035) 0 2px,transparent 2px 13px),
    repeating-linear-gradient(23deg,rgba(0,0,0,.2) 0 3px,transparent 3px 17px);
  mix-blend-mode:overlay;opacity:.7;
}
.paint{position:fixed;z-index:-1;pointer-events:none;border-radius:50%;filter:blur(3px);opacity:.55}
.p1{width:190px;height:420px;background:#d50028;left:-70px;top:8%;transform:rotate(22deg)}
.p2{width:260px;height:150px;background:#00a943;right:-90px;top:36%;transform:rotate(-18deg)}
.p3{width:230px;height:120px;background:#b90027;left:25%;bottom:-45px;transform:rotate(13deg)}
.wrap{max-width:760px;margin:auto;padding:34px 18px 55px}
.hero{text-align:center;padding:22px 10px 14px}
.avatar{
  width:108px;height:108px;margin:0 auto 16px;border-radius:50%;
  border:4px solid #fff;display:grid;place-items:center;
  background:linear-gradient(135deg,#111,#3b0010 50%,#003c1c);
  box-shadow:0 0 28px rgba(255,0,50,.35),0 0 25px rgba(0,255,90,.2);
  font-size:50px;
}
h1{margin:0;font-size:clamp(30px,7vw,52px);text-shadow:0 4px 20px #000}
.tag{margin:10px auto 0;color:#ddd;font-size:15px}
.links{display:grid;gap:15px;margin-top:28px}
.card{
  position:relative;display:flex;align-items:center;gap:15px;
  min-height:92px;padding:14px 17px;
  text-decoration:none;color:white;
  border:1px solid rgba(255,255,255,.16);
  border-radius:24px;
  background:rgba(8,8,8,.72);
  backdrop-filter:blur(12px);
  box-shadow:0 12px 35px rgba(0,0,0,.38);
  overflow:hidden;transition:.25s ease;
}
.card:before{
  content:"";position:absolute;inset:0;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.06),transparent);
  transform:translateX(-100%);transition:.5s;
}
.card:hover{transform:translateY(-4px) scale(1.01);border-color:rgba(255,255,255,.42)}
.card:hover:before{transform:translateX(100%)}
.animal{
  flex:0 0 64px;width:64px;height:64px;position:relative;
  border-radius:50%;display:grid;place-items:center;
  font-size:38px;background:#181818;border:2px solid rgba(255,255,255,.2);
  box-shadow:inset 0 0 20px rgba(255,255,255,.05);
}
.animal small{position:absolute;font-size:16px;bottom:-2px;right:-1px}
.info{min-width:0;flex:1}
.name{font-weight:800;font-size:19px}
.handle{color:#aaa;font-size:13px;margin-top:5px;direction:ltr;text-align:right;overflow:hidden;text-overflow:ellipsis}
.go{font-size:24px;color:#fff;opacity:.8}
.note{text-align:center;color:#aaa;font-size:12px;margin-top:28px}
.footer{text-align:center;color:#777;font-size:12px;margin-top:24px}
@media(max-width:430px){.wrap{padding:24px 13px 45px}.card{min-height:86px}.animal{width:58px;height:58px;flex-basis:58px;font-size:34px}}
</style>
